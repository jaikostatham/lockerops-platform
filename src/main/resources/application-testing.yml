spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME_TESTING}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

lockerops:
  api:
    read-only: true
    public-catalog-only: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  reservations:
    expiration:
      enabled: false
  access-code:
    hash-secret: ${ACCESS_CODE_HASH_SECRET}

server:
  port: ${PORT:${SERVER_PORT_TESTING:8081}}
