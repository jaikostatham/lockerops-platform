spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME_TESTING}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

lockerops:
  api:
    public-kiosk-only: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  reservations:
    expiration:
      enabled: true
  access-code:
    hash-secret: ${ACCESS_CODE_HASH_SECRET}

server:
  port: ${PORT:${SERVER_PORT_TESTING:8081}}
