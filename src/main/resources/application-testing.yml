spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_TESTING:lockerops_test}?sslmode=${DB_SSLMODE:disable}

  flyway:
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:}}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

lockerops:
  api:
    read-only: true
    public-catalog-only: true
  reservations:
    expiration:
      enabled: false

server:
  port: ${PORT:${SERVER_PORT_TESTING:8081}}
