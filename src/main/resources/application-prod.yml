spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME_PROD:lockerops_prod}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: ${PORT:${SERVER_PORT:8080}}

lockerops:
  api:
    read-only: true
    public-catalog-only: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  reservations:
    expiration:
      enabled: false
  access-code:
    hash-secret: ${ACCESS_CODE_HASH_SECRET}
