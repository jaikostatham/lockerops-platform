spring:
  application:
    name: lockerops-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lockerops_test}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}

  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        jdbc:
          batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:25}
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

lockerops:
  reservations:
    expiration:
      enabled: ${RESERVATION_EXPIRATION_ENABLED:true}
      fixed-delay-ms: ${RESERVATION_EXPIRATION_FIXED_DELAY_MS:60000}
      batch-size: ${RESERVATION_EXPIRATION_BATCH_SIZE:50}
  access-code:
    hash-secret: ${ACCESS_CODE_HASH_SECRET:dev-only-change-me}
    length: ${ACCESS_CODE_LENGTH:8}

service:
  code:
    0: "Proceso realizado correctamente"
    1000: "La validación de la petición ha fallado"
    1001: "El cuerpo de la petición no es válido"
    2001: "Estación de lockers no encontrada con id: %s"
    3001: "Compartimento no encontrado con id: %s"
    3002: "Ya existe un compartimento con ese número en esta estación"
    4001: "Reserva no encontrada con id: %s"
    4002: "El compartimento no está disponible para reservar"
    4003: "El compartimento ya tiene una reserva activa"
    4004: "La reserva no se puede cancelar porque no está activa"
    5001: "Ticket no encontrado con id: %s"
    5002: "Ticket no encontrado con código: %s"
    5003: "La reserva ya tiene un ticket emitido"
    5004: "El ticket no está activo"
    5101: "Código de acceso no encontrado"
    5102: "El código de acceso ha expirado"
    5103: "El código de acceso ha sido revocado"
    5104: "El código de acceso no está activo"
    5105: "La reserva asociada al código de acceso no está activa"
    5106: "El ticket o código de acceso no es válido"
